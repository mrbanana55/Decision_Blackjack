<svg xmlns="http://www.w3.org/2000/svg" width="500" height="700" viewBox="0 0 500 700">
  <title>Reverso de carta ornamental estilo clásico</title>
  <desc>Diseño vectorial simétrico azul y blanco, con filigranas, medallones florales y roseta central.</desc>
  <defs>
    <g id="flower" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle r="7" fill="#fff" stroke="none"/>
      <ellipse cy="-17" rx="6" ry="11"/><ellipse cy="17" rx="6" ry="11"/>
      <ellipse cx="-17" rx="11" ry="6"/><ellipse cx="17" rx="11" ry="6"/>
      <ellipse cx="-12" cy="-12" rx="5" ry="9" transform="rotate(-45 -12 -12)"/>
      <ellipse cx="12" cy="-12" rx="5" ry="9" transform="rotate(45 12 -12)"/>
      <ellipse cx="-12" cy="12" rx="5" ry="9" transform="rotate(45 -12 12)"/>
      <ellipse cx="12" cy="12" rx="5" ry="9" transform="rotate(-45 12 12)"/>
    </g>
    <g id="scroll" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 C22 -2 25 -28 10 -34 C-4 -40 -14 -26 -5 -18 C2 -12 10 -20 5 -24"/>
      <path d="M0 0 C-20 2 -25 27 -10 33 C4 39 14 25 5 17 C-2 11 -10 19 -5 23"/>
      <path d="M1 -1 C13 -10 21 -15 31 -13 C24 -7 21 0 20 7 C13 3 7 1 1 -1Z" fill="#fff" stroke="none"/>
      <path d="M-1 1 C-13 10 -21 15 -31 13 C-24 7 -21 0 -20 -7 C-13 -3 -7 -1 -1 1Z" fill="#fff" stroke="none"/>
    </g>
    <g id="corner-flourish" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 70 C3 38 15 16 42 8 C58 3 69 13 64 25 C60 34 47 33 46 24 C45 18 52 16 55 21"/>
      <path d="M6 54 C22 52 31 40 30 28 C20 31 13 40 6 54Z" fill="#fff"/>
      <path d="M17 18 C24 5 36 0 48 2 C39 9 35 16 34 24"/>
      <circle cx="12" cy="12" r="4" fill="#fff" stroke="none"/>
    </g>
    <pattern id="micro" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M9 1 L17 9 L9 17 L1 9Z" fill="none" stroke="#fff" stroke-width="1.1" opacity=".7"/>
      <circle cx="9" cy="9" r="1.5" fill="#fff"/>
    </pattern>
    <g id="medallion">
      <circle r="104" fill="#102f70" stroke="#fff" stroke-width="3"/>
      <circle r="96" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle r="87" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2 7"/>
      <circle r="77" fill="url(#micro)" stroke="#fff" stroke-width="1.5"/>
      <use href="#flower" transform="scale(1.8)"/>
      <path d="M0 -62 C-18 -42 -18 -24 0 -12 C18 -24 18 -42 0 -62Z" fill="#fff"/>
      <path d="M0 62 C-18 42 -18 24 0 12 C18 24 18 42 0 62Z" fill="#fff"/>
      <path d="M-62 0 C-42 -18 -24 -18 -12 0 C-24 18 -42 18 -62 0Z" fill="#fff"/>
      <path d="M62 0 C42 -18 24 -18 12 0 C24 18 42 18 62 0Z" fill="#fff"/>
      <circle r="18" fill="#102f70" stroke="#fff" stroke-width="2"/>
      <circle r="5" fill="#fff"/>
    </g>
  </defs>
  <!-- rounded card and double keyline -->
  <rect width="500" height="700" rx="34" fill="#fff"/>
  <rect x="15" y="15" width="470" height="670" rx="25" fill="#102f70"/>
  <rect x="25" y="25" width="450" height="650" rx="19" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="34" y="34" width="432" height="632" rx="15" fill="none" stroke="#fff" stroke-width="1.5"/>
  <rect x="43" y="43" width="414" height="614" rx="10" fill="url(#micro)"/>
  <rect x="53" y="53" width="394" height="594" rx="8" fill="#102f70" stroke="#fff" stroke-width="2.5"/>
  <!-- corner and side ornaments -->
  <use href="#corner-flourish" x="65" y="65"/>
  <use href="#corner-flourish" transform="translate(435 65) scale(-1 1)"/>
  <use href="#corner-flourish" transform="translate(65 635) scale(1 -1)"/>
  <use href="#corner-flourish" transform="translate(435 635) scale(-1 -1)"/>
  <use href="#scroll" transform="translate(82 230) rotate(-35)"/>
  <use href="#scroll" transform="translate(418 230) scale(-1 1) rotate(-35)"/>
  <use href="#scroll" transform="translate(82 470) scale(1 -1) rotate(-35)"/>
  <use href="#scroll" transform="translate(418 470) scale(-1 -1) rotate(-35)"/>
  <use href="#flower" transform="translate(250 82) scale(1.05)"/>
  <use href="#flower" transform="translate(250 618) scale(1.05)"/>
  <use href="#flower" transform="translate(78 350) scale(.9)"/>
  <use href="#flower" transform="translate(422 350) scale(.9)"/>
  <!-- mirrored central medallions -->
  <g transform="translate(250 245)"><use href="#medallion"/></g>
  <g transform="translate(250 455) rotate(180)"><use href="#medallion"/></g>
  <!-- connecting fan motif -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
    <path d="M145 320 Q195 342 225 350 Q195 358 145 380"/>
    <path d="M155 312 Q200 337 225 350 Q200 363 155 388"/>
    <path d="M355 320 Q305 342 275 350 Q305 358 355 380"/>
    <path d="M345 312 Q300 337 275 350 Q300 363 345 388"/>
    <path d="M190 331 Q220 345 238 350 Q220 355 190 369"/>
    <path d="M310 331 Q280 345 262 350 Q280 355 310 369"/>
  </g>
  <circle cx="250" cy="350" r="31" fill="#102f70" stroke="#fff" stroke-width="3"/>
  <circle cx="250" cy="350" r="24" fill="none" stroke="#fff" stroke-width="1.5"/>
  <g transform="translate(250 350)" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <path d="M0 -19 V19 M-19 0 H19 M-13 -13 L13 13 M-13 13 L13 -13"/>
    <path d="M0 -23 L4 -5 L0 -8 L-4 -5Z M23 0 L5 4 L8 0 L5 -4Z M0 23 L-4 5 L0 8 L4 5Z M-23 0 L-5 -4 L-8 0 L-5 4Z" fill="#fff"/>
    <circle r="5" fill="#102f70"/>
  </g>
</svg>
